<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="enzo: software for buildings, businesses and the big screen">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080f"/><stop offset="1" stop-color="#111827"/></linearGradient>
<radialGradient id="h1" cx=".18" cy=".1" r=".6"><stop offset="0" stop-color="#3b82f6" stop-opacity=".22"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="h2" cx=".85" cy=".95" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2a3550" stroke-width="1" stroke-opacity=".5"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1280" height="360" fill="url(#fade)"/></mask>
<linearGradient id="c0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient><linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5ce6"/><stop offset="1" stop-color="#64d2ff"/></linearGradient><linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#00c7be"/></linearGradient>
<style>
.t{font:700 72px -apple-system,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#f5f5f7;letter-spacing:-2px}
.s{font:500 22px -apple-system,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9aa0ad}
.k{font:600 13px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#3b82f6;letter-spacing:2.5px}
.lab{font:600 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#9aa0ad;letter-spacing:1.5px}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 9s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:600}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 9s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes grow{0%,8%{transform:scaleY(.08)}40%,80%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
.card{transform-box:fill-box;transform-origin:50% 60%;animation:focus 9s cubic-bezier(.2,.8,.2,1) infinite;opacity:.7}
@keyframes focus{0%,100%{transform:scale(1);opacity:.7}8%,28%{transform:scale(1.18) translateY(-4px);opacity:1}36%{transform:scale(1);opacity:.7}}
.dot{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.draw,.bar,.card,.dot{animation:none;stroke-dashoffset:0;transform:none}}</style>
</defs>
<rect width="1280" height="360" rx="28" fill="url(#bg)"/>
<rect width="1280" height="360" rx="28" fill="url(#grid)" mask="url(#m)"/>
<rect width="1280" height="360" rx="28" fill="url(#h1)"/>
<rect width="1280" height="360" rx="28" fill="url(#h2)"/>
<text x="72" y="118" class="k">CONSTRUCTION · ERP · TVOS</text>
<text x="70" y="200" class="t">enzo</text>
<text x="72" y="244" class="s">Software for buildings, businesses</text>
<text x="72" y="274" class="s">and the big screen.</text>
<rect x="666" y="75" width="170" height="210" rx="18" fill="#0d1424" stroke="#1e293b"/><text x="682" y="269" class="lab">ESTIMATING</text><g fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><polyline class="draw" stroke-opacity="1" points="705,189 751,213 797,189 797,133 751,109 705,133 705,189"/><polyline class="draw" style="animation-delay:.4s" stroke-opacity="1" points="705,133 751,157 797,133"/><polyline class="draw" style="animation-delay:.6s" stroke-opacity="1" points="751,157 751,213"/><polyline class="draw" style="animation-delay:.9s" stroke-opacity="0.55" points="721,165 721,189"/><polyline class="draw" style="animation-delay:1.1s" stroke-opacity="0.55" points="737,173 737,197"/><polyline class="draw" style="animation-delay:1.3s" stroke-opacity="0.55" points="765,173 765,197"/><polyline class="draw" style="animation-delay:1.5s" stroke-opacity="0.55" points="781,165 781,189"/></g><text x="682" y="243" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#22d3ee">Σ 1 284 m² · 2,3 M€</text><rect x="856" y="75" width="170" height="210" rx="18" fill="#0d1424" stroke="#1e293b"/><text x="872" y="269" class="lab">ERP</text><rect class="bar" style="animation-delay:0.00s" x="878" y="177" width="14" height="48" rx="4" fill="#3b82f6" fill-opacity="0.45"/><rect class="bar" style="animation-delay:0.12s" x="900" y="147" width="14" height="78" rx="4" fill="#3b82f6" fill-opacity="0.54"/><rect class="bar" style="animation-delay:0.24s" x="922" y="163" width="14" height="62" rx="4" fill="#3b82f6" fill-opacity="0.63"/><rect class="bar" style="animation-delay:0.36s" x="944" y="121" width="14" height="104" rx="4" fill="#3b82f6" fill-opacity="0.72"/><rect class="bar" style="animation-delay:0.48s" x="966" y="137" width="14" height="88" rx="4" fill="#3b82f6" fill-opacity="0.81"/><rect class="bar" style="animation-delay:0.60s" x="988" y="99" width="14" height="126" rx="4" fill="#3b82f6" fill-opacity="0.90"/><line x1="872" y1="226" x2="1010" y2="226" stroke="#1e293b" stroke-width="2"/><circle class="dot" cx="1004" cy="99" r="5" fill="#22c55e"/><rect x="1046" y="75" width="170" height="210" rx="18" fill="#0d1424" stroke="#1e293b"/><text x="1062" y="269" class="lab">APPLE TV</text><rect class="card" style="animation-delay:0s" x="1066" y="125" width="38" height="58" rx="7" fill="url(#c0)"/><rect class="card" style="animation-delay:3s" x="1112" y="125" width="38" height="58" rx="7" fill="url(#c1)"/><rect class="card" style="animation-delay:6s" x="1158" y="125" width="38" height="58" rx="7" fill="url(#c2)"/><rect x="1066" y="203" width="130" height="5" rx="2.5" fill="#1e293b"/><rect x="1066" y="203" width="81" height="5" rx="2.5" fill="#f59e0b"/>
</svg>